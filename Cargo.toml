[package]
name = "pklith"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Materialize hk git hook guardrails from what a repository's files require"
repository = "https://github.com/pr0d1r2/pklith"
readme = "README.md"
keywords = ["git-hooks", "hk", "linter", "coverage", "nix"]
categories = ["development-tools", "command-line-utilities"]
# Unpublished until the first release (root T69).
publish = false

[[bin]]
name = "pklith"
path = "src/main.rs"

[dependencies]
globset = { version = "0.4", default-features = false }

[workspace]
# `dev/` maintains this repository's own files and ships to nobody: a
# `publish = false` member cannot land on a consumer's PATH or in the
# tarball, where a second `[[bin]]` here would (as sherd-dev, sherd §C).
members = ["dev"]

[lints]
workspace = true

[workspace.lints.rust]
unsafe_code = "forbid"

# Code limits (§C), Sandi Metz adapted; thresholds in clippy.toml. They land
# with the clippy step that enforces them. Every workspace member takes them.
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cognitive_complexity = "deny"
excessive_nesting = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
dbg_macro = "deny"
