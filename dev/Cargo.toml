[package]
name = "pklith-dev"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Development-only tooling for the pklith repository; never published"
# It maintains files in THIS repository and means nothing to anyone who
# installs pklith, so it is a workspace member that cannot be published.
publish = false

[[bin]]
name = "pklith-dev"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# A path dependency on the crate this one maintains: the catalog page is
# rendered through pklith's own parsers, never a second reading of the
# format. Same commit, same lock, same gate: nothing to drift.
pklith = { path = ".." }

# cargo-release acts on every workspace member; this one is never released.
[package.metadata.release]
release = false
